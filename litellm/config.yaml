litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  cache: false
  request_timeout: 120
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
  num_retries: 1
  fallbacks:
    - company-fast: ["company-standard"]
    - company-standard: ["company-fast"]
    - company-pro: ["company-standard"]
    - company-agent: ["company-standard"]

general_settings:
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  allow_user_auth: true
  # Admin UI is protected by UI_USERNAME / UI_PASSWORD plus the master key.
  # Do not share the LiteLLM URL with employees; they use Open WebUI or /v1.
