# ImStem company model aliases.
#
# Employee-facing models (company-fast / company-standard / company-pro /
# mimo-pro / company-agent) live in Postgres, NOT in this file, so the
# Admin UI can retarget the backend LLM and edit prices:
#   LiteLLM UI → Models + Endpoints → click a database-badge row → Edit
#
# Seed or reset those rows:
#   python3 scripts/bootstrap-credentials.py
#   python3 scripts/sync-company-models.py
#
# Provider keys: LiteLLM UI → LLM Credentials (deepseek | dashscope | mimo)
#
# Codex / Claude Code default model names are aliased onto company-agent
# below so spend still lands on the employee's AGENT key.

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  cache: false
  request_timeout: 120
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
  num_retries: 1
  fallbacks:
    - company-fast: ["company-standard"]
    - company-standard: ["company-fast"]
    - company-pro: ["company-standard"]
    - mimo-pro: ["company-pro"]
    - company-agent: ["company-standard"]
  model_group_alias:
    gpt-4o: company-agent
    gpt-4.1: company-agent
    gpt-4: company-agent
    gpt-5: company-agent
    o3: company-agent
    o3-mini: company-agent
    o4-mini: company-agent
    claude-sonnet-4-20250514: company-agent
    claude-opus-4-20250514: company-agent
    claude-3-5-sonnet-latest: company-agent
    claude-3-5-haiku-latest: company-agent
    claude-sonnet-4-5: company-agent
    claude-haiku-4-5: company-agent
    claude-opus-4-1: company-agent

general_settings:
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  allow_user_auth: true
  # Admin UI is protected by UI_USERNAME / UI_PASSWORD plus the master key.
  # Do not share the LiteLLM URL with employees; they use Open WebUI or /v1.
