# ImStem company model aliases.
# Employees only ever see company-* names. Swap providers here without
# changing employee clients.

model_list:
  # Fast / cheap default chat
  - model_name: company-fast
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      id: company-fast
      mode: chat
      description: Fast low-cost route (DeepSeek)

  - model_name: company-fast
    litellm_params:
      model: openai/qwen-turbo
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
      id: company-fast-qwen
      mode: chat
      description: Fallback for company-fast (Qwen Turbo)

  # Everyday quality
  - model_name: company-standard
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
      id: company-standard
      mode: chat
      description: Standard quality (Qwen Plus)

  - model_name: company-standard
    litellm_params:
      model: openai/mimo-v2.5-flash
      api_base: https://api.xiaomimimo.com/v1
      api_key: os.environ/MIMO_API_KEY
    model_info:
      id: company-standard-mimo
      mode: chat
      description: Fallback for company-standard (MiMo Flash)

  # Best approved domestic quality
  - model_name: company-pro
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: https://api.xiaomimimo.com/v1
      api_key: os.environ/MIMO_API_KEY
    model_info:
      id: company-pro
      mode: chat
      description: High-quality domestic route (MiMo V2.5 Pro)

  - model_name: company-pro
    litellm_params:
      model: openai/qwen-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
      id: company-pro-qwen
      mode: chat
      description: Fallback for company-pro (Qwen Max)

  # Tool calling / agents
  - model_name: company-agent
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      id: company-agent
      mode: chat
      description: Agent / tool-calling route (DeepSeek)

  - model_name: company-agent
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
      id: company-agent-qwen
      mode: chat
      description: Fallback for company-agent (Qwen Plus)

  # Codex / Claude Code send their own default model names. Map them onto
  # company-agent so each employee's AGENT virtual key still owns the spend.
  - model_name: gpt-4o
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      id: agent-compat-gpt-4o
      mode: chat
  - model_name: gpt-4.1
