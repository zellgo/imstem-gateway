# ImStem company model aliases.
#
# Employee-facing models live in Postgres (LiteLLM_ProxyModelTable), NOT
# in this file, so the Admin UI can retarget backends and edit prices:
#   LiteLLM UI → Models + Endpoints → database-badge row → Edit
#
# Seed or reset those rows:
#   python3 scripts/bootstrap-credentials.py --update
#   python3 scripts/sync-company-models.py
#
# Provider keys: LiteLLM UI → LLM Credentials (dashscope | dashscope-tokenplan | mimo)
#
# Codex / Claude Code default model names (gpt-4o, claude-sonnet-4-5, …)
# remap to kimi-k3 so spend still lands on the employee's AGENT key.
# Old company-* names still remap below but are not shown in the picker.

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  cache: false
  request_timeout: 180
  set_verbose: false
  callbacks: ["landing_plugin.landing_plugin"]

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
  num_retries: 1
  # No fallbacks: when a backend errors (e.g. quota exhausted) the user sees
  # that model's own error in Open WebUI instead of a silent downgrade.
  model_group_alias:
    company-fast: qwen3.8-flash
    company-standard: qwen3.8-27b
    company-pro: qwen3.8-max
    company-agent: kimi-k3
    mimo-pro: mimo-v2.5-pro
    GLM-5.3-Flash: glm-5.3-flash
    glm-5.3-flash-next: glm-5.3-flash
    z-ai/glm-5.3-flash: glm-5.3-flash
    gpt-4o: kimi-k3
    gpt-4.1: kimi-k3
    gpt-4: kimi-k3
    gpt-5: kimi-k3
    o3: kimi-k3
    o3-mini: qwen3.8-flash
    o4-mini: qwen3.8-flash
    claude-sonnet-4-20250514: kimi-k3
    claude-opus-4-20250514: kimi-k3
    claude-3-5-sonnet-latest: kimi-k3
    claude-3-5-haiku-latest: qwen3.8-flash
    claude-sonnet-4-5: kimi-k3
    claude-haiku-4-5: qwen3.8-flash
    claude-opus-4-1: kimi-k3

general_settings:
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  allow_user_auth: true
  ui_access_mode: admin_only
  user_header_name: X-OpenWebUI-User-Email
  # Admin UI is protected by UI_USERNAME / UI_PASSWORD plus the master key.
  # Employees use https://chat.imstem.org and https://llm.imstem.org/v1.
