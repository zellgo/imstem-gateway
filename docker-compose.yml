# Local development stack.
# PostgreSQL lives on Railway. Run `./scripts/db-tunnel.sh` first so
# 127.0.0.1:15432 forwards into the private Postgres service.

name: imstem-gateway

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL_DOCKER}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD}
      LITELLM_NUM_WORKERS: "1"
      LITELLM_DISABLE_NO_REDIS_WARNING: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL_DOCKER}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: ImStem AI
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
      WEBUI_AUTH: "true"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_BOOTSTRAP_KEY}
      ENABLE_OLLAMA_API: "false"
      ENABLE_PERSISTENT_CONFIG: "true"
      VECTOR_DB: chroma
    depends_on:
      litellm:
        condition: service_healthy

volumes:
  open-webui-data:
